AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Acceso al ambiente de votacion popular con permisos minimos: desarrolladores por IAM
  Identity Center (grupo, permission set y asignacion) y GitHub Actions por OIDC (rol de
  despliegue); politica de ejecucion acotada para CloudFormation (cdk bootstrap) y limite de
  permisos para los roles que crea CDK. La despliega un administrador, antes de cdk bootstrap.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: >-
      Desarrollador (Identity Center, grupo votacion-<stage>-developers) -> permission set ->
      DeployPolicy. GitHub Actions (OIDC, environment <stage>) -> GitHubDeployRole -> DeployPolicy.
      DeployPolicy solo asume los roles de cdk bootstrap, lee los stacks y sube el front. El
      rol de ejecucion de CloudFormation usa CdkExecutionPolicy en vez de AdministratorAccess,
      y todo rol que cree CDK debe llevar AppPermissionsBoundary (lo aplica infra/cdk/lib/app.ts).
    must:
      - Desplegar este stack con credenciales de administrador, no con los roles de CDK.
      - Despues de crearlo, ejecutar cdk bootstrap con --cloudformation-execution-policies apuntando a CdkExecutionPolicy.
      - Los nombres votacion-<stage>-* y Votacion-<stage>-* deben coincidir con infra/cdk (config.ts y los ids de stack).
    ref:
      - README.md (seccion Acceso al ambiente dev)
      - .github/workflows/deploy-aws.yml

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev]
    Description: Ambiente; prod queda fuera hasta integrar Cognito.
  IdentityCenterInstanceArn:
    Type: String
    AllowedPattern: "arn:aws:sso:::instance/ssoins-[a-f0-9]{16}"
    Description: ARN de la instancia de IAM Identity Center (aws sso-admin list-instances).
  IdentityStoreId:
    Type: String
    AllowedPattern: "d-[a-z0-9]{10}"
    Description: Id del Identity Store (aws sso-admin list-instances).
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: Qualifier de cdk bootstrap (el valor por defecto de CDK).
  GitHubRepository:
    Type: String
    Default: Aer0Cl/Sistema-de-votacion-popular
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: Repositorio (owner/nombre) cuyo workflow puede asumir GitHubDeployRole.

Resources:
  AppPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Techo de permisos para los roles de las Lambdas: aunque un despliegue cree un rol con
          una politica amplia, solo podra usar DynamoDB y CloudWatch Logs del proyecto.
        must:
          - El nombre debe coincidir con APP_PERMISSIONS_BOUNDARY en infra/cdk/lib/config.ts.
          - Debe cubrir todo lo que usan las Lambdas (tablas votacion-<stage>-* y sus logs).
    Properties:
      ManagedPolicyName: !Sub votacion-${Stage}-app-boundary
      Description: Limite de permisos para los roles que crea CDK en el proyecto
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TablasDelProyecto
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/votacion-${Stage}-*
          - Sid: LogsDeLasLambdas
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/votacion-${Stage}-*

  CdkExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Reemplaza AdministratorAccess en el rol de ejecucion de cdk bootstrap: CloudFormation
          solo puede gestionar recursos del proyecto. Sin esto, cualquiera que asuma el rol de
          despliegue de CDK podria crear cualquier recurso de la cuenta.
        must:
          - Crear o modificar roles solo con AppPermissionsBoundary (condicion iam:PermissionsBoundary).
          - Si un despliegue falla por AccessDenied, agregar la accion puntual, no comodines de servicio completos.
    Properties:
      ManagedPolicyName: !Sub votacion-${Stage}-cdk-execution
      Description: Permisos del rol de ejecucion de CloudFormation para desplegar el proyecto
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DynamoDB
            Effect: Allow
            Action: dynamodb:*
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/votacion-${Stage}-*
          - Sid: Lambda
            Effect: Allow
            Action: lambda:*
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:votacion-${Stage}-*
          - Sid: CodigoDeLambdaDesdeAssets
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::cdk-${CdkQualifier}-assets-${AWS::AccountId}-${AWS::Region}/*
          - Sid: GruposDeLogs
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/votacion-${Stage}-*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/votacion-${Stage}-*
          # Requeridos por API Gateway para los logs de acceso; no admiten restriccion por recurso
          # https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-logging.html
          - Sid: EntregaDeLogsDeApiGateway
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
          # Los ids de las APIs son aleatorios, por eso el recurso no lleva el nombre del proyecto
          - Sid: HttpApi
            Effect: Allow
            Action: apigateway:*
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
          - Sid: ReglaProgramada
            Effect: Allow
            Action: events:*
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/votacion-${Stage}-*
          - Sid: AlarmasYPanel
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
              - cloudwatch:PutDashboard
              - cloudwatch:GetDashboard
              - cloudwatch:DeleteDashboards
            Resource:
              - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:votacion-${Stage}-*
              - !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/votacion-${Stage}-*
          - Sid: BucketDelFront
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::votacion-${Stage}-web-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::votacion-${Stage}-web-${AWS::AccountId}/*
          # Los ids de distribuciones y OAC son aleatorios, por eso el recurso no lleva el nombre
          - Sid: CloudFront
            Effect: Allow
            Action: cloudfront:*
            Resource:
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
          # Fn::GetStackOutput (referencias entre stacks de CDK) se resuelve con este rol
          # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html
          - Sid: ReferenciasEntreStacks
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/Votacion-${Stage}-*/*
          - Sid: VersionDeBootstrap
            Effect: Allow
            Action: ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/${CdkQualifier}/version
          - Sid: CrearRolesSoloConLimite
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Votacion-${Stage}-*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref AppPermissionsBoundary
          - Sid: AdministrarRolesDelProyecto
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:DeleteRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Votacion-${Stage}-*
          - Sid: PasarRolesSoloALambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Votacion-${Stage}-*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: NoQuitarElLimite
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: "*"

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Permisos para desplegar la aplicacion, compartidos por los desarrolladores (permission
          set) y GitHub Actions (GitHubDeployRole): asumir los roles de cdk bootstrap, leer las
          salidas de los stacks, subir el front al bucket e invalidar CloudFront.
        must:
          - No agregar permisos de IAM: el despliegue de infraestructura pasa por los roles de CDK.
    Properties:
      ManagedPolicyName: !Sub votacion-${Stage}-deploy
      Description: Desplegar los stacks con CDK y subir el front a S3 y CloudFront
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DesplegarConCdk
            Effect: Allow
            Action: sts:AssumeRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-image-publishing-role-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}
          - Sid: LeerStacksDelProyecto
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/Votacion-${Stage}-*/*
          - Sid: ListarBucketDelFront
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::votacion-${Stage}-web-${AWS::AccountId}
          - Sid: SubirFront
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:${AWS::Partition}:s3:::votacion-${Stage}-web-${AWS::AccountId}/*
          - Sid: InvalidarCloudFront
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          GitHub Actions obtiene credenciales temporales por OIDC, sin llaves de acceso guardadas
          como secretos del repositorio.
        must:
          - Solo puede haber un proveedor por URL en la cuenta; otros proyectos deben reutilizarlo.
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Rol que asume .github/workflows/deploy-aws.yml para desplegar el stage. Solo lo pueden
          asumir los jobs del environment de GitHub con el nombre del stage, cuyas reglas de
          proteccion (ramas permitidas, revisores) se configuran en el repositorio.
        must:
          - Mantener la condicion sub restringida al repositorio y al environment; nunca usar comodines.
          - El nombre va en minusculas para no coincidir con role/Votacion-<stage>-*, que gestiona CDK.
    Properties:
      RoleName: !Sub votacion-${Stage}-github-deploy
      Description: Despliegue del sistema de votacion popular desde GitHub Actions (OIDC)
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Ref DeployPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${Stage}

  DevelopersGroup:
    Type: AWS::IdentityStore::Group
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Los permisos se asignan al grupo y no a cada persona: para dar acceso basta con agregar
          al usuario de Identity Center al grupo.
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      DisplayName: !Sub votacion-${Stage}-developers
      Description: Desarrolladores del sistema de votacion popular

  DeveloperPermissionSet:
    Type: AWS::SSO::PermissionSet
    # CustomerManagedPolicyReferences usa el nombre de la politica, no crea dependencia implicita
    DependsOn: DeployPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Permisos minimos del desarrollador: desplegar via los roles de CDK, cargar el catalogo
          inicial (seed) y leer logs, alarmas y panel. Credenciales temporales de 8 horas.
        must:
          - No agregar permisos de IAM ni de Identity Center: permitiria escalar privilegios.
    Properties:
      InstanceArn: !Ref IdentityCenterInstanceArn
      Name: !Sub Votacion-${Stage}-Developer
      Description: Desarrollador del sistema de votacion popular (permisos minimos)
      SessionDuration: PT8H
      # Despliegue (CDK, S3 y CloudFront): la misma politica que usa GitHub Actions
      CustomerManagedPolicyReferences:
        - Name: !Sub votacion-${Stage}-deploy
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: CargaInicial
            Effect: Allow
            Action: dynamodb:PutItem
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/votacion-${Stage}-users
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/votacion-${Stage}-categories
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/votacion-${Stage}-nominees
          - Sid: LeerLogsDelProyecto
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:StartQuery
              - logs:StopQuery
              - logs:GetLogGroupFields
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/votacion-${Stage}-*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/votacion-${Stage}-*
          # Lecturas que no admiten restriccion por recurso (listar grupos, resultados de consultas, metricas)
          - Sid: LecturasSinRecurso
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeQueries
              - logs:GetQueryResults
              - cloudwatch:GetMetricData
              - cloudwatch:ListDashboards
            Resource: "*"
          - Sid: AlarmasYPanel
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - cloudwatch:GetDashboard
            Resource:
              - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:votacion-${Stage}-*
              - !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/votacion-${Stage}-*

  DevelopersAssignment:
    Type: AWS::SSO::Assignment
    Metadata:
      com.aws.cloudformation.Context:
        why: Da al grupo de desarrolladores el permission set en esta cuenta.
    Properties:
      InstanceArn: !Ref IdentityCenterInstanceArn
      PermissionSetArn: !GetAtt DeveloperPermissionSet.PermissionSetArn
      PrincipalType: GROUP
      PrincipalId: !GetAtt DevelopersGroup.GroupId
      TargetType: AWS_ACCOUNT
      TargetId: !Ref AWS::AccountId

Outputs:
  CdkExecutionPolicyArn:
    Description: Pasar a cdk bootstrap --cloudformation-execution-policies
    Value: !Ref CdkExecutionPolicy
  AppPermissionsBoundaryArn:
    Description: Limite de permisos que CDK aplica a todos sus roles
    Value: !Ref AppPermissionsBoundary
  DevelopersGroupName:
    Description: Grupo de Identity Center al que se agregan los desarrolladores
    Value: !Sub votacion-${Stage}-developers
  PermissionSetName:
    Description: Permission set que se elige en aws configure sso
    Value: !Sub Votacion-${Stage}-Developer
  GitHubDeployRoleArn:
    Description: Variable AWS_DEPLOY_ROLE_ARN del environment de GitHub
    Value: !GetAtt GitHubDeployRole.Arn
