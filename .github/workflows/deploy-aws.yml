name: CI y despliegue en AWS

# Verifica cada PR y despliega en dev cada push a main o a feature/*. A mano (Actions > Run
# workflow) se elige la rama en "Use workflow from" y el ambiente en la lista. Los stacks de
# CloudFormation (Votacion-<stage>-Data, -Web y -Api) los crea CDK; el front se compila con la
# URL de la API desplegada y se sube al bucket del stack Web.
#
# Todas las ramas comparten el mismo ambiente dev: queda desplegado el ultimo push. Las ramas
# deben estar permitidas en el environment de GitHub (Deployment branches: main y feature/*).
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/*'
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desplegar (environment de GitHub y stage de CDK)
        type: choice
        options:
          - dev
        default: dev

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STAGE: ${{ inputs.environment || 'dev' }}

jobs:
  checks:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Backend en Python (pytest) y empaquetado de la Lambda en el synth
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

      - name: Synth con cdk-nag
        working-directory: infra/cdk
        run: npx cdk synth --strict --quiet -c stage=$STAGE

  deploy:
    name: Desplegar en ${{ inputs.environment || 'dev' }}
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # El rol de AWS solo confia en jobs de este environment (ver dev-access.yaml). El environment
    # define la variable AWS_DEPLOY_ROLE_ARN y las ramas que pueden desplegar: la rama elegida en
    # "Use workflow from" debe estar permitida ahi, por eso no hay un input de rama aparte
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ steps.stack.outputs.web_url }}
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # Python del runtime de la Lambda, para empaquetarla con uv (lib/python-bundling.ts)
      - run: uv python install 3.14
      - run: npm ci

      # Credenciales temporales por OIDC: sin llaves de acceso en los secretos del repositorio
      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Desplegar los stacks con CDK
        working-directory: infra/cdk
        run: npx cdk deploy --all -c stage=$STAGE --require-approval never --outputs-file cdk-outputs.json

      - name: Leer las salidas de los stacks
        id: stack
        working-directory: infra/cdk
        run: |
          output() { jq -er --arg stack "$1" --arg key "$2" '.[$stack][$key]' cdk-outputs.json; }
          {
            echo "api_url=$(output "Votacion-$STAGE-Api" ApiUrl)"
            echo "bucket=$(output "Votacion-$STAGE-Web" WebBucketName)"
            echo "distribution_id=$(output "Votacion-$STAGE-Web" DistributionId)"
            echo "web_url=$(output "Votacion-$STAGE-Web" WebUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Compilar el front
        run: npm run build -w @votacion/web
        env:
          VITE_API_URL: ${{ steps.stack.outputs.api_url }}

      # Primero los assets con hash (cache larga), luego index.html y el resto (sin cache) y al
      # final se borran los assets viejos, para no romper a quien tenga cargada la version anterior
      - name: Subir el front a S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"

      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution_id }}" --paths "/*"

      # Falla el despliegue si la API recien desplegada no responde
      - name: Probar la API
        env:
          API_URL: ${{ steps.stack.outputs.api_url }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$API_URL/health"

      # La lista sale de los decoradores @app.<metodo>("<ruta>") de app.py: siempre coincide con
      # lo desplegado. Los parametros <id> se muestran como {id}
      - name: Resumen
        env:
          API_URL: ${{ steps.stack.outputs.api_url }}
          WEB_URL: ${{ steps.stack.outputs.web_url }}
        run: |
          endpoints=$(grep -oE '@app\.(get|post|put|patch|delete)\("[^"]+"\)' apps/api/src/votacion_api/app.py \
            | sed -E 's/@app\.([a-z]+)\("([^"]+)"\)/\1 \2/; s/<([a-z_]+)>/{\1}/g')
          echo "Endpoints de la API:"
          while read -r method path; do echo "  ${method^^} $API_URL$path"; done <<< "$endpoints"
          {
            echo "### Despliegue en $STAGE"
            echo "- Rama: \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA::7}\`), por $GITHUB_EVENT_NAME"
            echo "- Front: $WEB_URL"
            echo "- API: $API_URL"
            echo ""
            echo "#### Endpoints de la API"
            echo ""
            echo "En dev el usuario va en el encabezado \`X-User-Id\` (p. ej. \`u-alice\`, admin)."
            echo ""
            echo "| Metodo | URL |"
            echo "| --- | --- |"
            while read -r method path; do echo "| ${method^^} | \`$API_URL$path\` |"; done <<< "$endpoints"
          } >> "$GITHUB_STEP_SUMMARY"
