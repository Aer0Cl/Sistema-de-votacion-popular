[project]
name = "votacion-api"
version = "0.1.0"
description = "Backend del sistema de votacion popular (AWS Lambda)"
requires-python = ">=3.13"
# boto3 no se empaqueta: lo provee el runtime de Lambda
dependencies = ["aws-lambda-powertools>=3.4,<4"]

[dependency-groups]
dev = ["boto3>=1.35", "moto[dynamodb]>=5.0", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/votacion_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
